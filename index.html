  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

: 0.12em; text-transform: uppercase; color: var(--accent, #FF9500);\"><span data-lang=\"de\">Erkennen<\u002Fspan><span data-lang=\"en\">Recognise<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top: 8px; font-size: 16px; line-height: 1.5; color: rgba(255,255,255,0.7);\"><span data-lang=\"de\">Jeder Titel im Stream bekommt Cover, Interpret und Uhrzeit — automatisch.<\u002Fspan><span data-lang=\"en\">Every track on the stream gets artwork, artist and timestamp — automatically.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #1c1c1c; padding: 26px 28px;\">\n        <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent, #FF9500);\"><span data-lang=\"de\">Herzen<\u002Fspan><span data-lang=\"en\">Heart it<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top: 8px; font-size: 16px; line-height: 1.5; color: rgba(255,255,255,0.7);\"><span data-lang=\"de\">Ein Tap, und der Song liegt in deinen Favoriten. Auch Tage später noch auffindbar.<\u002Fspan><span data-lang=\"en\">One tap and the song sits in your favourites. Still findable days later.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #1c1c1c; padding: 26px 28px;\">\n        <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent, #FF9500);\"><span data-lang=\"de\">Behalten<\u002Fspan><span data-lang=\"en\">Keep it<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top: 8px; font-size: 16px; line-height: 1.5; color: rgba(255,255,255,0.7);\"><span data-lang=\"de\">Ein Export schreibt alles in eine Spotify-Playlist, die dir gehört.<\u002Fspan><span data-lang=\"en\">One export writes it all into a Spotify playlist that's yours.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"features\" data-sec=\"96\" style=\"position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 96px 24px 0;\">\n    <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: 1fr; gap: 26px; align-items: end; margin-bottom: 48px;\" data-splithead=\"1\">\n      <div>\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 18px;\">\n          <span style=\"width: 22px; height: 22px; border-radius: 2px; background: var(--accent, #FF9500); display: block;\"><\u002Fspan>\n          <span style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.5);\"><span data-lang=\"de\">Was drin steckt<\u002Fspan><span data-lang=\"en\">What's inside<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <h2 style=\"margin: 0; font-size: 50px; line-height: 1.02; font-weight: 800; letter-spacing: -0.025em; text-wrap: balance;\"><span data-lang=\"de\">Live-Radio, das jeden Titel kennt.<\u002Fspan><span data-lang=\"en\">Live radio that knows every track.<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: 18px; line-height: 1.55; color: rgba(255,255,255,0.65); text-wrap: pretty; max-width: 420px;\"><span data-lang=\"de\">Ein Stream-Player mit einer Metadaten-Engine dahinter — geschrieben einmal in Kotlin, nativ auf beiden Plattformen.<\u002Fspan><span data-lang=\"en\">A stream player with a metadata engine behind it — written once in Kotlin, native on both platforms.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px;\">\n      <div data-reveal=\"1\" data-card=\"1\" style=\"padding: 32px 28px 34px; border-radius: 22px; background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(196,196,196,0.02) 67%); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5.6px); box-shadow: 0px 4px 6px rgba(0,0,0,0.18); transition: box-shadow 240ms cubic-bezier(0.2,0,0,1), border-color 240ms cubic-bezier(0.2,0,0,1), transform 240ms cubic-bezier(0.2,0,0,1);\" style-hover=\"box-shadow: 0px 12px 32px rgba(0,0,0,0.25), 0px 2px 4px rgba(0,0,0,0.18); border-color: rgba(255,255,255,0.2); transform: translateY(-3px);\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;\">\n          <div style=\"width: 48px; height: 48px; border-radius: 16px; background: rgba(255,149,0,0.14); display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"link-2\" style=\"width: 22px; height: 22px; color: var(--accent, #FF9500);\"><\u002Fi><\u002Fdiv>\n          <span style=\"padding: 3px 9px; border-radius: 9999px; border: 1px solid rgba(255,149,0,0.4); background: rgba(255,149,0,0.12); color: var(--accent, #FF9500); font-size: 11px; font-weight: 800; letter-spacing: 0.04em;\">PRO<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin: 0 0 10px; font-size: 21px; font-weight: 700; letter-spacing: -0.01em;\"><span data-lang=\"de\">Spotify-Verknüpfung<\u002Fspan><span data-lang=\"en\">Spotify connection<\u002Fspan><\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: rgba(255,255,255,0.62);\"><span data-lang=\"de\">Konto einmal verbinden, Favoriten geräteübergreifend synchron halten — und mit einem Tap in die Playlist „BMRadio Favoriten\" exportieren.<\u002Fspan><span data-lang=\"en\">Connect your account once, keep favourites in sync across devices — and export them to the “BMRadio Favoriten” playlist with one tap.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" data-card=\"1\" style=\"padding: 32px 28px 34px; border-radius: 22px; background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(196,196,196,0.02) 67%); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5.6px); box-shadow: 0px 4px 6px rgba(0,0,0,0.18); transition: box-shadow 240ms cubic-bezier(0.2,0,0,1), border-color 240ms cubic-bezier(0.2,0,0,1), transform 240ms cubic-bezier(0.2,0,0,1);\" style-hover=\"box-shadow: 0px 12px 32px rgba(0,0,0,0.25), 0px 2px 4px rgba(0,0,0,0.18); border-color: rgba(255,255,255,0.2); transform: translateY(-3px);\">\n        <div style=\"width: 48px; height: 48px; border-radius: 16px; background: rgba(255,149,0,0.14); display: flex; align-items: center; justify-content: center; margin-bottom: 22px;\"><i data-lucide=\"search\" style=\"width: 22px; height: 22px; color: var(--accent, #FF9500);\"><\u002Fi><\u002Fdiv>\n        <h3 style=\"margin: 0 0 10px; font-size: 21px; font-weight: 700; letter-spacing: -0.01em;\">Smart Search<\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: rgba(255,255,255,0.62);\"><span data-lang=\"de\">Suche nach Songs, Künstlern oder nutze Filter nach Tag und Uhrzeit. Auch verstümmelte Stream-Titel werden sauber aufgelöst.<\u002Fspan><span data-lang=\"en\">Search songs and artists, or filter by day and time. Even mangled stream titles resolve to the right track.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" data-card=\"1\" style=\"padding: 32px 28px 34px; border-radius: 22px; background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(196,196,196,0.02) 67%); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5.6px); box-shadow: 0px 4px 6px rgba(0,0,0,0.18); transition: box-shadow 240ms cubic-bezier(0.2,0,0,1), border-color 240ms cubic-bezier(0.2,0,0,1), transform 240ms cubic-bezier(0.2,0,0,1);\" style-hover=\"box-shadow: 0px 12px 32px rgba(0,0,0,0.25), 0px 2px 4px rgba(0,0,0,0.18); border-color: rgba(255,255,255,0.2); transform: translateY(-3px);\">\n        <div style=\"width: 48px; height: 48px; border-radius: 16px; background: rgba(255,149,0,0.14); display: flex; align-items: center; justify-content: center; margin-bottom: 22px;\"><i data-lucide=\"image\" style=\"width: 22px; height: 22px; color: var(--accent, #FF9500);\"><\u002Fi><\u002Fdiv>\n        <h3 style=\"margin: 0 0 10px; font-size: 21px; font-weight: 700; letter-spacing: -0.01em;\">Metadata Engine<\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: rgba(255,255,255,0.62);\"><span data-lang=\"de\">Der Stream liefert Text, BmRadio liefert alles andere: Cover und Interpret automatisch, in Echtzeit, für jeden Titel — mit verknüpftem Spotify-Konto (Pro) inklusive direktem Spotify-Link.<\u002Fspan><span data-lang=\"en\">The stream gives you text; BmRadio gives you the rest: artwork and artist automatically, in real time, for every track — with a linked Spotify account (Pro) you also get a direct Spotify link.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" data-card=\"1\" style=\"padding: 32px 28px 34px; border-radius: 22px; background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(196,196,196,0.02) 67%); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5.6px); box-shadow: 0px 4px 6px rgba(0,0,0,0.18); transition: box-shadow 240ms cubic-bezier(0.2,0,0,1), border-color 240ms cubic-bezier(0.2,0,0,1), transform 240ms cubic-bezier(0.2,0,0,1);\" style-hover=\"box-shadow: 0px 12px 32px rgba(0,0,0,0.25), 0px 2px 4px rgba(0,0,0,0.18); border-color: rgba(255,255,255,0.2); transform: translateY(-3px);\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;\">\n          <div style=\"width: 48px; height: 48px; border-radius: 16px; background: rgba(255,149,0,0.14); display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"bell-ring\" style=\"width: 22px; height: 22px; color: var(--accent, #FF9500);\"><\u002Fi><\u002Fdiv>\n          <span style=\"padding: 3px 9px; border-radius: 9999px; border: 1px solid rgba(255,149,0,0.4); background: rgba(255,149,0,0.12); color: var(--accent, #FF9500); font-size: 11px; font-weight: 800; letter-spacing: 0.04em;\">PRO<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin: 0 0 10px; font-size: 21px; font-weight: 700; letter-spacing: -0.01em;\"><span data-lang=\"de\">Lieblingssong-Alarm<\u002Fspan><span data-lang=\"en\">Favourite-song alerts<\u002Fspan><\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: rgba(255,255,255,0.62);\"><span data-lang=\"de\">Benachrichtige mich, wenn ein Lieblingssong läuft — solange BmRadio im Hintergrund läuft. (Auch bei komplett geschlossener App: siehe Roadmap.)<\u002Fspan><span data-lang=\"en\">Get a notification when one of your favourites comes on — as long as BmRadio is running in the background. (Support for a fully closed app is on the roadmap.)<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" data-card=\"1\" style=\"padding: 32px 28px 34px; border-radius: 22px; background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(196,196,196,0.02) 67%); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5.6px); box-shadow: 0px 4px 6px rgba(0,0,0,0.18); transition: box-shadow 240ms cubic-bezier(0.2,0,0,1), border-color 240ms cubic-bezier(0.2,0,0,1), transform 240ms cubic-bezier(0.2,0,0,1);\" style-hover=\"box-shadow: 0px 12px 32px rgba(0,0,0,0.25), 0px 2px 4px rgba(0,0,0,0.18); border-color: rgba(255,255,255,0.2); transform: translateY(-3px);\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;\">\n          <div style=\"width: 48px; height: 48px; border-radius: 16px; background: rgba(255,149,0,0.14); display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"sliders-horizontal\" style=\"width: 22px; height: 22px; color: var(--accent, #FF9500);\"><\u002Fi><\u002Fdiv>\n          <span style=\"padding: 3px 9px; border-radius: 9999px; border: 1px solid rgba(255,149,0,0.4); background: rgba(255,149,0,0.12); color: var(--accent, #FF9500); font-size: 11px; font-weight: 800; letter-spacing: 0.04em;\">PRO<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"margin: 0 0 10px; font-size: 21px; font-weight: 700; letter-spacing: -0.01em;\">Equalizer<\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: rgba(255,255,255,0.62);\"><span data-lang=\"de\">Vorgefertigte Klangprofile für jeden Musikgeschmack — direkt im Player umschaltbar. (Android)<\u002Fspan><span data-lang=\"en\">Pre-tuned sound presets for every taste — switchable right from the player. (Android)<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"screens\" data-sec=\"100\" style=\"position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 100px 24px 0;\">\n    <div data-reveal=\"1\" style=\"max-width: 700px; margin-bottom: 44px;\">\n      <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 18px;\">\n        <span style=\"width: 22px; height: 22px; border-radius: 2px; background: var(--accent, #FF9500); display: block;\"><\u002Fspan>\n        <span style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.5);\"><span data-lang=\"de\">Die App<\u002Fspan><span data-lang=\"en\">The app<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"margin: 0; font-size: 50px; line-height: 1.02; font-weight: 800; letter-spacing: -0.025em;\"><span data-lang=\"de\">Jede Ecke durchdacht.<\u002Fspan><span data-lang=\"en\">Considered in every corner.<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px;\">\n\n      <div data-reveal=\"1\" data-span=\"7\" style=\"grid-column: span 7; border-radius: 22px; overflow: hidden; background: #1c1c1c; border: 1px solid rgba(255,255,255,0.09); box-shadow: 0px 4px 6px rgba(0,0,0,0.18); display: flex; flex-direction: column;\">\n        <div style=\"padding: 30px 30px 0;\">\n          <h3 style=\"margin: 0 0 6px; font-size: 23px; font-weight: 700; letter-spacing: -0.01em;\"><span data-lang=\"de\">Playlist mit Verlauf<\u002Fspan><span data-lang=\"en\">Playlist with history<\u002Fspan><\u002Fh3>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: rgba(255,255,255,0.6);\"><span data-lang=\"de\">Alles, was heute lief — durchsuchbar, filterbar nach Tag und Zeit, mit Herz-Badge auf jedem Cover.<\u002Fspan><span data-lang=\"en\">Everything that played today — searchable, filterable by day and time, with a heart badge on every cover.<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n        <div style=\"margin: 26px 30px 0; border-radius: 16px 16px 0 0; background: #121212; border: 1px solid rgba(255,255,255,0.07); border-bottom: none; padding: 18px 0 0; flex: 1;\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 0 16px 14px;\">\n            <span style=\"font-size: 20px; font-weight: 700;\">Playlist<\u002Fspan>\n            <div style=\"display: flex; gap: 12px; color: #8A8A8E;\"><i data-lucide=\"search\" style=\"width: 19px; height: 19px;\"><\u002Fi><i data-lucide=\"sliders-horizontal\" style=\"width: 19px; height: 19px;\"><\u002Fi><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; padding: 0 16px 14px;\">\n            <span style=\"padding: 6px 13px; border-radius: 9999px; background: var(--accent, #FF9500); color: #111; font-size: 12px; font-weight: 700;\">Letzte 7 Tage<\u002Fspan>\n            <span style=\"padding: 6px 13px; border-radius: 9999px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); font-size: 12px; font-weight: 500;\">Abends<\u002Fspan>\n            <span style=\"padding: 6px 13px; border-radius: 9999px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); font-size: 12px; font-weight: 500;\">Zurücksetzen<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8A8A8E; padding: 0 16px 8px;\">HEUTE<\u002Fdiv>\n\n          <div style=\"display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: rgba(255,149,0,0.08);\">\n            <div style=\"position: relative; width: 52px; height: 52px; border-radius: 12px; background: linear-gradient(135deg, #6b4a3a, #2b2b2c); flex-shrink: 0;\">\n              <div style=\"position: absolute; right: -2px; bottom: -2px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent, #FF9500); border: 2px solid #121212; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"heart\" style=\"width: 10px; height: 10px; color: #111111; fill: #111111;\"><\u002Fi><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-width: 0;\">\n              <div style=\"font-size: 15px; font-weight: 700; color: var(--accent, #FF9500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">Solar Power<\u002Fdiv>\n              <div style=\"font-size: 13px; color: #8A8A8E;\">Lorde<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: flex-end; gap: 3px; height: 18px; width: 26px;\">\n              <span style=\"flex: 1; background: var(--accent, #FF9500); border-radius: 1px; height: 100%; transform-origin: bottom; animation: eqbar 0.9s ease-in-out infinite;\"><\u002Fspan>\n              <span style=\"flex: 1; background: var(--accent, #FF9500); border-radius: 1px; height: 100%; transform-origin: bottom; animation: eqbar 0.9s ease-in-out 0.15s infinite;\"><\u002Fspan>\n              <span style=\"flex: 1; background: var(--accent, #FF9500); border-radius: 1px; height: 100%; transform-origin: bottom; animation: eqbar 0.9s ease-in-out 0.3s infinite;\"><\u002Fspan>\n            <\u002Fdiv>\n            <i data-lucide=\"more-vertical\" style=\"width: 18px; height: 18px; color: #8A8A8E;\"><\u002Fi>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; align-items: center; gap: 16px; padding: 8px 16px;\">\n            <div style=\"position: relative; width: 52px; height: 52px; border-radius: 12px; background: linear-gradient(135deg, #3a4a6b, #2b2b2c); flex-shrink: 0;\">\n              <div style=\"position: absolute; right: -2px; bottom: -2px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.45); border: 2px solid #121212; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"heart\" style=\"width: 10px; height: 10px; color: #FFFFFF;\"><\u002Fi><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-width: 0;\">\n              <div style=\"font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">Blinding Lights<\u002Fdiv>\n              <div style=\"font-size: 13px; color: #8A8A8E;\">The Weeknd<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size: 14px; color: #8A8A8E; font-variant-numeric: tabular-nums;\">20:14<\u002Fdiv>\n            <i data-lucide=\"more-vertical\" style=\"width: 18px; height: 18px; color: #8A8A8E;\"><\u002Fi>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; align-items: center; gap: 16px; padding: 8px 16px;\">\n            <div style=\"position: relative; width: 52px; height: 52px; border-radius: 12px; background: linear-gradient(135deg, #4a6b5a, #2b2b2c); flex-shrink: 0;\">\n              <div style=\"position: absolute; right: -2px; bottom: -2px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent, #FF9500); border: 2px solid #121212; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"heart\" style=\"width: 10px; height: 10px; color: #111111; fill: #111111;\"><\u002Fi><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 1; min-width: 0;\">\n              <div style=\"font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">Alles was zählt<\u002Fdiv>\n              <div style=\"font-size: 13px; color: #8A8A8E;\">AnnenMayKantereit<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size: 14px; color: #8A8A8E; font-variant-numeric: tabular-nums;\">19:52<\u002Fdiv>\n            <i data-lucide=\"more-vertical\" style=\"width: 18px; height: 18px; color: #8A8A8E;\"><\u002Fi>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" data-span=\"5\" style=\"grid-column: span 5; display: flex; flex-direction: column; gap: 20px;\">\n        <div style=\"border-radius: 22px; background: #1c1c1c; border: 1px solid rgba(255,255,255,0.09); padding: 28px; box-shadow: 0px 4px 6px rgba(0,0,0,0.18);\">\n          <h3 style=\"margin: 0 0 6px; font-size: 21px; font-weight: 700;\"><span data-lang=\"de\">Offline? Kein Drama.<\u002Fspan><span data-lang=\"en\">Offline? No drama.<\u002Fspan><\u002Fh3>\n          <p style=\"margin: 0 0 20px; font-size: 15px; line-height: 1.55; color: rgba(255,255,255,0.6);\"><span data-lang=\"de\">Der Stream startet von selbst wieder, sobald du online bist. Deine Playlist bleibt lesbar.<\u002Fspan><span data-lang=\"en\">The stream picks itself back up the moment you're online again. Your playlist stays readable.<\u002Fspan><\u002Fp>\n          <div style=\"display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #2a1e0e; border: 1px solid rgba(255,149,0,0.35);\">\n            <div style=\"width: 30px; height: 30px; border-radius: 50%; background: rgba(255,149,0,0.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><i data-lucide=\"wifi-off\" style=\"width: 15px; height: 15px; color: var(--accent, #FF9500);\"><\u002Fi><\u002Fdiv>\n            <div style=\"flex: 1; min-width: 0;\">\n              <div style=\"font-size: 14px; font-weight: 700;\">Keine Verbindung<\u002Fdiv>\n              <div style=\"font-size: 12px; color: #8A8A8E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">Der Stream startet, sobald du wieder online bist.<\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"padding: 6px 13px; border-radius: 9999px; background: var(--accent, #FF9500); color: #111; font-size: 12px; font-wei <\u002Fspan><span data-lang=\"en\">PRODUCT<\u002Fspan><\u002Fdiv>\n          <a href=\"#features\" style=\"font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.7);\" style-hover=\"color: #fff;\">Features<\u002Fa>\n          <a href=\"#screens\" style=\"font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.7);\" style-hover=\"color: #fff;\">Screenshots<\u002Fa>\n          <a href=\"#pro\" style=\"font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.7);\" style-hover=\"color: #fff;\">BmRadio Pro<\u002Fa>\n          <a href=\"#roadmap\" style=\"font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.7);\" style-hover=\"color: #fff;\">Roadmap<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 11px;\">\n          <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: rgba(255,255,255,0.4);\"><span data-lang=\"de\">RECHTLICHES<\u002Fspan><span data-lang=\"en\">LEGAL<\u002Fspan><\u002Fdiv>\n          <a href=\"#\" style=\"font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.7);\" style-hover=\"color: #fff;\"><span data-lang=\"de\">Impressum<\u002Fspan><span data-lang=\"en\">Imprint<\u002Fspan><\u002Fa>\n          <a href=\"#\" style=\"font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.7);\" style-hover=\"color: #fff;\"><span data-lang=\"de\">Datenschutz<\u002Fspan><span data-lang=\"en\">Privacy<\u002Fspan><\u002Fa>\n          <a href=\"#\" style=\"font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.7);\" style-hover=\"color: #fff;\"><span data-lang=\"de\">Lizenzen<\u002Fspan><span data-lang=\"en\">Licences<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: rgba(255,255,255,0.4); margin-bottom: 12px;\">NEWSLETTER<\u002Fdiv>\n        <p style=\"margin: 0 0 16px; max-width: 300px; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,0.55);\"><span data-lang=\"de\">Ein kurzes Update, wenn ein neues Feature live geht. Kein Spam.<\u002Fspan><span data-lang=\"en\">A short note whenever a new feature ships. No spam.<\u002Fspan><\u002Fp>\n        <form sc-camel-on-submit=\"{{ onSubscribe }}\" style=\"display: flex; gap: 8px; max-width: 340px;\">\n          <input type=\"email\" placeholder=\"deine@mail.de\" required=\"required\" data-mailinput=\"1\" style=\"flex: 1; min-width: 0; padding: 12px 15px; border-radius: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #fff; font-family: inherit; font-size: 14px; outline: none;\" style-focus=\"border-color: #FF9500; box-shadow: 0 0 0 2px rgba(255,149,0,0.25);\">\n          <button type=\"submit\" style=\"padding: 12px 18px; border-radius: 16px; border: none; background: var(--accent, #FF9500); color: #111; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;\" style-hover=\"filter: brightness(1.1);\" style-active=\"transform: scale(0.98);\"><span data-lang=\"de\">Abonnieren<\u002Fspan><span data-lang=\"en\">Subscribe<\u002Fspan><\u002Fbutton>\n        <\u002Fform>\n        <div style=\"margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--accent, #FF9500); min-height: 18px;\">{{ subscribeMsg }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 22px 24px 40px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,0.4);\">\n      <span>© 2026 BmRadio<\u002Fspan>\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px;\">Kotlin Multiplatform · Compose · Media3 / AVPlayer<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF9500&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#FF9500&quot;,&quot;#8B5CF6&quot;,&quot;#1DB954&quot;,&quot;#00C2FF&quot;],&quot;section&quot;:&quot;Marke&quot;}}\">\nconst COPY = {\n  de: { thanks: 'Danke — du bist eingetragen.', mail: 'deine@mail.de' },\n  en: { thanks: 'Thanks — you\\u2019re on the list.', mail: 'you@mail.com' },\n};\n\nclass Component extends DCLogic {\n  state = { subscribeMsg: '', lang: 'de' };\n\n  icons() {\n    if (window.lucide && window.lucide.createIcons) {\n      try { window.lucide.createIcons(); } catch (e) {}\n    }\n  }\n\n  // Both languages live in the markup as sibling spans, so switching is a display flip — no\n  // re-render of copy, and every string stays directly editable in the template.\n  applyLang() {\n    const lang = this.state.lang;\n    document.documentElement.setAttribute('lang', lang);\n    document.querySelectorAll('[data-lang]').forEach((el) => {\n      el.style.display = el.getAttribute('data-lang') === lang ? '' : 'none';\n    });\n    document.querySelectorAll('[data-langbtn]').forEach((b) => {\n      const on = b.getAttribute('data-langbtn') === lang;\n      b.style.background = on ? 'var(--accent, #FF9500)' : 'transparent';\n      b.style.color = on ? '#111111' : 'rgba(255,255,255,0.6)';\n    });\n    const mail = document.querySelector('[data-mailinput]');\n    if (mail) mail.placeholder = COPY[lang].mail;\n  }\n\n  setLang(lang) {\n    try { localStorage.setItem('bmradio-lang', lang); } catch (e) {}\n    this.setState({ lang, subscribeMsg: this.state.subscribeMsg ? COPY[lang].thanks : '' });\n  }\n\n  responsive() {\n    const root = document.querySelector('[data-root]');\n    if (!root) return;\n    const w = window.innerWidth;\n    const wide = w >= 1000;\n    const mid = w >= 680;\n    const hero = root.querySelector('[data-hero]');\n    if (hero) {\n      hero.style.gridTemplateColumns = wide ? '1.05fr 0.95fr' : '1fr';\n      hero.style.paddingTop = wide ? '76px' : '44px';\n    }\n    root.querySelectorAll('h1').forEach((h) => { h.style.fontSize = wide ? '74px' : (mid ? '54px' : '40px'); });\n    root.querySelectorAll('h2').forEach((h) => { h.style.fontSize = wide ? '50px' : (mid ? '38px' : '31px'); });\n    root.querySelectorAll('[data-navlink]').forEach((a) => { a.style.display = mid ? 'block' : 'none'; });\n    root.querySelectorAll('[data-span]').forEach((el) => {\n      el.style.gridColumn = wide ? 'span ' + el.getAttribute('data-span') : 'span 12';\n    });\n    const band = root.querySelector('[data-band]');\n    if (band) band.style.gridTemplateColumns = mid ? 'repeat(3, 1fr)' : '1fr';\n    const splithead = root.querySelector('[data-splithead]');\n    if (splithead) splithead.style.gridTemplateColumns = wide ? '1.4fr 1fr' : '1fr';\n    // Three plans: side by side when wide; at mid width the lifetime card spans the full second\n    // row rather than being orphaned in a half-empty one.\n    const plans = root.querySelector('[data-plans]');\n    if (plans) plans.style.gridTemplateColumns = wide ? 'repeat(3, 1fr)' : (mid ? 'repeat(2, 1fr)' : '1fr');\n    const lifetime = root.querySelector('[data-plan=\"lifetime\"]');\n    if (lifetime) lifetime.style.gridColumn = (mid && !wide) ? 'span 2' : '';\n    root.querySelectorAll('[data-rmgrid]').forEach((el) => {\n      el.style.gridTemplateColumns = mid ? 'repeat(' + Math.min(2, Number(el.getAttribute('data-rmgrid'))) + ', 1fr)' : '1fr';\n    });\n    const footer = root.querySelector('[data-grid=\"footer\"]');\n    if (footer) footer.style.gridTemplateColumns = wide ? '1.2fr 1fr 1fr' : '1fr';\n\n    // ── Mobile ────────────────────────────────────────────────────────────\n    const narrow = w < 680;\n    const tiny = w < 420;\n\n    // The phone mock is a fixed 330px internal layout. Below ~380px of usable width it would be\n    // clipped, so scale it down as a unit and reclaim the vertical space the scale frees up.\n    const phone = root.querySelector('[data-phone]');\n    if (phone) {\n      const avail = w - 48;\n      const s = Math.min(1, avail / 346);\n      phone.style.transform = s < 1 ? 'scale(' + s.toFixed(3) + ')' : '';\n      phone.style.transformOrigin = 'center top';\n      phone.style.marginBottom = s < 1 ? -(680 * (1 - s)).toFixed(0) + 'px' : '';\n    }\n\n    // Touch targets: 44px minimum on mobile, tighter on desktop where the pointer is precise.\n    root.querySelectorAll('[data-langbtn-el]').forEach((b) => {\n      b.style.minHeight = narrow ? '44px' : '';\n      b.style.padding = narrow ? '0 14px' : '6px 12px';\n    });\n    const hcta = root.querySelector('[data-headercta]');\n    if (hcta) {\n      hcta.style.minHeight = narrow ? '44px' : '';\n      hcta.style.padding = narrow ? '0 16px' : '10px 18px';\n    }\n    root.querySelectorAll('[data-social]').forEach((a) => {\n      a.style.width = narrow ? '44px' : '38px';\n      a.style.height = narrow ? '44px' : '38px';\n    });\n\n    // The wordmark is the first thing to go when the header row runs out of room.\n    const wordmark = root.querySelector('[data-wordmark]');\n    if (wordmark) wordmark.style.display = tiny ? 'none' : '';\n\n    // Full-width store buttons read as proper targets instead of two cramped half-width chips.\n    const storerow = root.querySelector('[data-storerow]');\n    if (storerow) {\n      storerow.querySelectorAll('a').forEach((a) => {\n        a.style.flex = tiny ? '1 1 100%' : '';\n        a.style.justifyContent = tiny ? 'center' : '';\n      });\n    }\n\n    // Section rhythm: the 96-110px desktop gaps are far too much air on a phone.\n    root.querySelectorAll('[data-sec]').forEach((el) => {\n      const pt = Number(el.getAttribute('data-sec'));\n      el.style.paddingTop = narrow ? Math.round(pt * 0.58) + 'px' : pt + 'px';\n    });\n    const proinner = root.querySelector('[data-proinner]');\n    if (proinner) proinner.style.padding = narrow ? '56px 24px 60px' : '88px 24px 92px';\n    const proSec = root.querySelector('#pro');\n    if (proSec) proSec.style.marginTop = narrow ? '64px' : '110px';\n    const ctaband = root.querySelector('[data-ctaband]');\n    if (ctaband) ctaband.style.padding = narrow ? '40px 24px' : '64px 48px';\n  }\n\n  componentDidMount() {\n    let saved = null;\n    try { saved = localStorage.getItem('bmradio-lang'); } catch (e) {}\n    if (saved === 'en' || saved === 'de') this.setState({ lang: saved });\n\n    this.icons();\n    [120, 400, 1000, 2200].forEach((t) => setTimeout(() => { this.icons(); this.applyLang(); }, t));\n\n    this.applyLang();\n    this.responsive();\n    this._onResize = () => this.responsive();\n    window.addEventListener('resize', this._onResize);\n\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n\n    const targets = Array.from(document.querySelectorAll('[data-reveal]'));\n    const show = (el) => {\n      if (el.dataset.revealed === '1') return;\n      el.dataset.revealed = '1';\n      el.style.animation = 'aa-rise 420ms cubic-bezier(0.2,0,0,1) both';\n      el.style.opacity = '';\n    };\n    // The sweep is the source of truth: anything at or above the viewport bottom is shown, so a\n    // fast scroll, an anchor jump or scroll restoration can never strand a block at opacity 0.\n    const sweep = () => {\n      targets.forEach((el) => {\n        if (el.getBoundingClientRect().top < window.innerHeight * 0.92) show(el);\n      });\n    };\n    targets.forEach((el) => {\n      if (el.getBoundingClientRect().top < window.innerHeight * 0.92) show(el);\n      else el.style.opacity = '0';\n    });\n    this._sweep = () => {\n      if (this._raf) return;\n      this._raf = requestAnimationFrame(() => { this._raf = null; sweep(); });\n    };\n    window.addEventListener('scroll', this._sweep, { passive: true });\n    window.addEventListener('resize', this._sweep);\n    this._safety = setTimeout(() => targets.forEach(show), 4000);\n  }\n\n  componentDidUpdate() { this.icons(); this.applyLang(); this.responsive(); }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n    if (this._sweep) {\n      window.removeEventListener('scroll', this._sweep);\n      window.removeEventListener('resize', this._sweep);\n    }\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._safety) clearTimeout(this._safety);\n  }\n\n  renderVals() {\n    return {\n      accent: this.props.accent ?? '#FF9500',\n      subscribeMsg: this.state.subscribeMsg,\n      setDe: () => this.setLang('de'),\n      setEn: () => this.setLang('en'),\n      onSubscribe: (e) => {\n        e.preventDefault();\n        this.setState({ subscribeMsg: COPY[this.state.lang].thanks });\n      },\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
