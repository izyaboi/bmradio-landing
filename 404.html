<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden | BmRadio</title>
  <link rel="stylesheet" href="legal.css">
</head>
<body>
  <main class="not-found">
    <div class="eyebrow">BmRadio</div>
    <h1><span data-lang="de">Seite nicht gefunden</span><span data-lang="en">Page not found</span></h1>
    <p class="intro"><span data-lang="de">Diese Seite gibt es nicht oder sie wurde verschoben.</span><span data-lang="en">This page does not exist or has moved.</span></p>
    <a class="header-cta" href="./"><span data-lang="de">Zur Startseite</span><span data-lang="en">Back home</span></a>
    <div class="lang-switch" aria-label="Language">
      <button type="button" data-lang-button="de" aria-pressed="true">DE</button>
      <button type="button" data-lang-button="en" aria-pressed="false">EN</button>
    </div>
  </main>
  <script>
    const setLanguage = (language) => {
      document.documentElement.lang = language;
      document.querySelectorAll('[data-lang]').forEach((element) => {
        element.hidden = element.dataset.lang !== language;
      });
      document.querySelectorAll('[data-lang-button]').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.langButton === language));
      });
      localStorage.setItem('bmradio-lang', language);
    };
    document.querySelectorAll('[data-lang-button]').forEach((button) => button.addEventListener('click', () => setLanguage(button.dataset.langButton)));
    setLanguage(localStorage.getItem('bmradio-lang') === 'en' ? 'en' : 'de');
  </script>
</body>
</html>
